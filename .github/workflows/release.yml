name: release
on:
  workflow_run:
    workflows: [tag]
    types: [completed]
  push:
    tags: ['v*']
jobs:
  release:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test
      - id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          asset="$(npm pack --silent)"
          test -f "$asset"
          expected="$(sha256sum "$asset")"
          if ! gh release view "$version" >/dev/null 2>&1; then
            gh release create "$version" "$asset" --title "$version" --notes "$version"
          fi
          gh release download "$version" --pattern "$(basename "$asset")" --dir "$RUNNER_TEMP/release-back"
          actual="$(sha256sum "$RUNNER_TEMP/release-back/$(basename "$asset")")"
          test "${expected%% *}" = "${actual%% *}"
